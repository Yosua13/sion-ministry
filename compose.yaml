services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in backend/.env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in backend/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    env_file: backend/.env
    environment:
      # Default development keeps local Docker usable without an SMTP service.
      # Set APP_ENV=production together with SMTP_* and HTTPS values when deploying.
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/backend/uploads

volumes:
  postgres-data:
  uploads-data:
